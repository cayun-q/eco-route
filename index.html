<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <aside id="panel" aria-live="polite">
      <h1>Route &amp; CO₂</h1>
      <label class="mode-field" for="transport-mode">
        Transport mode
        <select id="transport-mode">
          <option value="driving-car" selected>Driving (Car)</option>
          <option value="driving-ev">Electric Vehicle (EV)</option>
          <option value="cycling-regular">Bicycle</option>
          <option value="foot-walking">Walking</option>
        </select>
      </label>
      <p id="status">Click the map to set a start point.</p>
      <dl id="stats" hidden>
        <div>
          <dt>Distance</dt>
          <dd id="distance">—</dd>
        </div>
        <div>
          <dt>Duration</dt>
          <dd id="duration">—</dd>
        </div>
        <div>
          <dt>CO₂</dt>
          <dd id="co2">—</dd>
        </div>
      </dl>
      <p id="error" class="error" hidden></p>
      <button type="button" id="reset" hidden>Clear route</button>
    </aside>
    <div id="map"></div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
