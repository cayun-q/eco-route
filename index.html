<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eco-Score Calculator</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Eco-Score</h1>
      <p class="lede">
        Score out of 100 from transport-mode carbon intensity. No map — just the
        calculation.
      </p>

      <label class="field" for="transport-mode">
        Transport mode
        <select id="transport-mode">
          <option value="driving-car" selected>Driving (Car)</option>
          <option value="driving-ev">Electric Vehicle (EV)</option>
          <option value="cycling-regular">Bicycle</option>
          <option value="foot-walking">Walking</option>
        </select>
      </label>

      <section class="score" aria-label="Eco-Score result">
        <div class="score__row">
          <span class="score__label">Eco-Score</span>
          <p class="score__value">
            <span id="eco-score-value">0</span>
            <span class="score__out-of">/ 100</span>
          </p>
        </div>
        <div
          class="score__track"
          role="meter"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-labelledby="eco-score-value"
        >
          <div id="eco-score-meter" class="score__meter"></div>
        </div>
        <p class="score__meta">
          Carbon intensity: <strong id="intensity">—</strong>
        </p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
